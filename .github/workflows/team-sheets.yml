name: Team Attendance Sheets

on:
  # Manual only for now: Actions tab -> "Team Attendance Sheets" -> Run workflow.
  workflow_dispatch:
    inputs:
      team_ids:
        description: "Comma-separated team codes to build/refresh (e.g. 16T or 16T,18S), or ALL for every team"
        default: "16T"
        required: true
      season:
        description: "Optional override. Leave blank to use the season set on the admin Teams tab."
        default: ""
        required: false
      share_with_coaches:
        description: "Give each team's coach view access (Google emails them). Leave unticked to build the sheets quietly first."
        type: boolean
        default: false
      sheet_ids:
        description: "Optional: use sheets you created yourself, as TEAM=spreadsheetId (e.g. 16T=1AbC...). Share each with the service account as Editor."
        default: ""
        required: false

jobs:
  build-sheets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node build-team-sheets.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.SERVICE_ACCOUNT }}
          TEAM_IDS: ${{ inputs.team_ids }}
          SHEET_IDS: ${{ inputs.sheet_ids }}
          SHARE_WITH_COACHES: ${{ inputs.share_with_coaches }}
          SEASON_LABEL: ${{ inputs.season }}
          SHEET_HELPER_URL: ${{ secrets.SHEET_HELPER_URL }}
          SHEET_HELPER_SECRET: ${{ secrets.SHEET_HELPER_SECRET }}
          REPORT_TIMEZONE: "America/New_York"
