name: Team Attendance Sheets

on:
  # Nightly at 2 AM US Eastern (see daily-report.yml for why there are two
  # entries and a gate step). Scheduled runs rebuild every team's sheet and the
  # director's summary, and keep the coach/director access up to date (silently).
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 7 * * *"
  # Manual: Actions tab -> "Team Attendance Sheets" -> Run workflow (or the
  # Reports tab in the admin console).
  workflow_dispatch:
    inputs:
      team_ids:
        description: "Comma-separated team codes to build/refresh (e.g. 16T or 16T,18S), or ALL for every team"
        default: "16T"
        required: true
      season:
        description: "Optional override. Leave blank to use the season set on the admin Teams tab."
        default: ""
        required: false
      build_master:
        description: "Also build the director's all-teams summary sheet (refreshes every team first, ignoring team_ids)."
        type: boolean
        default: false
      share_with_director:
        description: "With build_master: give the director (DIRECTOR_EMAIL secret) view access. No email is sent."
        type: boolean
        default: true
      share_with_coaches:
        description: "Give each team's coach view access (no email is sent; use Email to coach on the Teams tab). Leave unticked to build the sheets first."
        type: boolean
        default: false
      sheet_ids:
        description: "Optional: use sheets you created yourself, as TEAM=spreadsheetId (e.g. 16T=1AbC...). Share each with the service account as Editor."
        default: ""
        required: false

# Never run two at once (e.g. a scheduled run and a button press).
concurrency:
  group: team-sheets
  cancel-in-progress: false

jobs:
  build-sheets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - id: gate
        run: |
          # Run in the 2 AM Eastern hour. The one exception is the spring night the
          # clocks jump from 2 AM to 3 AM: there is no 2 AM, so run at 3 AM, which is
          # recognizable because an hour earlier it was still 1 AM.
          HOUR=$(TZ=America/New_York date +%H)
          PREV=$(TZ=America/New_York date -d '1 hour ago' +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HOUR" != "02" ] && { [ "$HOUR" != "03" ] || [ "$PREV" != "01" ]; }; then
            echo "Not the 2 AM Eastern hour ($(TZ=America/New_York date)); skipping this duplicate trigger."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - if: steps.gate.outputs.run == 'true'
        run: npm install
      - if: steps.gate.outputs.run == 'true'
        run: node build-team-sheets.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.SERVICE_ACCOUNT }}
          # Scheduled runs have no inputs, so they default to everything.
          TEAM_IDS: ${{ inputs.team_ids || 'ALL' }}
          SHEET_IDS: ${{ inputs.sheet_ids }}
          SHARE_WITH_COACHES: ${{ github.event_name == 'schedule' || inputs.share_with_coaches }}
          BUILD_MASTER: ${{ github.event_name == 'schedule' || inputs.build_master }}
          SHARE_WITH_DIRECTOR: ${{ github.event_name == 'schedule' || inputs.share_with_director }}
          DIRECTOR_EMAIL: ${{ secrets.DIRECTOR_EMAIL }}
          SEASON_LABEL: ${{ inputs.season }}
          SHEET_HELPER_URL: ${{ secrets.SHEET_HELPER_URL }}
          SHEET_HELPER_SECRET: ${{ secrets.SHEET_HELPER_SECRET }}
          REPORT_TIMEZONE: "America/New_York"
