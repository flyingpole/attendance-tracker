name: Daily Attendance Report

on:
  schedule:
    # SAFETY NET. The on-time trigger is the Apps Script nightly trigger in
    # apps-script/sheet-helper.gs (2 AM Eastern), which starts this workflow via
    # workflow_dispatch. GitHub's own scheduler is unreliable here: it has been
    # starting scheduled runs 7-10 hours late, so these only catch a night the
    # Apps Script trigger missed. The script skips if the day's report already
    # went out, so extra triggers are harmless. (GitHub cron is UTC.)
    # Scheduled workflows are auto-disabled after 60 days of repo inactivity.
    - cron: "17 6 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      skip_if_done:
        description: "Skip if yesterday's report has already been sent (used by the nightly trigger)."
        type: boolean
        default: false
      report_date:
        description: "Optional catch-up: re-send the report for this day (YYYY-MM-DD) instead of yesterday."
        default: ""
        required: false

# Never run two at once (e.g. a scheduled run and a button press).
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node send-daily-report.js
        env:
          # The key was saved in GitHub as "SERVICE_ACCOUNT"; accept either name.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIRECTOR_EMAIL: ${{ secrets.DIRECTOR_EMAIL }}
          SKIP_IF_DONE: ${{ github.event_name == 'schedule' || inputs.skip_if_done }}
          REPORT_DATE: ${{ inputs.report_date }}
          REPORT_TIMEZONE: "America/New_York"
